<!-- Attribute structure observed in real Chrome on 2026-10-16; content and IDs are synthetic. -->
<aside><div data-chatgpt-search-unit-key="sidebar:0:assistant">Not a conversation answer</div></aside>
<main data-app-shell-main-surface="browser">
  <div data-turn-key="user-current">
    <div data-content-search-turn-key="fallback-turn-0">
      <div data-talvt-turn-state="complete">
        <div>
          <div>
            <h4 class="sr-only">You said:</h4>
            <div data-chatgpt-search-unit-key="fallback-turn-0:0:user" data-chatgpt-search-message-ids="user-current">
              <div data-content-search-unit-key="fallback-turn-0:0:user">Keep current native features</div>
            </div>
          </div>
          <div>
            <span hidden data-chatgpt-agent-turn-start></span>
            <div data-content-search-unit-key="fallback-turn-0:2:assistant" data-chatgpt-search-unit-key="fallback-turn-0:2:assistant" data-chatgpt-search-message-ids="answer-current answer-current">
              <h4 class="sr-only" data-conversation-role="assistant" tabindex="-1">ChatGPT said:</h4>
              <div>
                <div data-chatgpt-selection-conversation-id="bundle-check" data-chatgpt-selection-message-id="answer-current">
                  <div data-markdown-text-style="assistant-message"><p>Current native answer with a <a href="https://example.org/current-source">citation</a>.</p></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="turn-action-controls"><button id="current-native-action" aria-label="More actions">More</button></div>
      </div>
    </div>
  </div>
  <div hidden data-chatgpt-search-unit-key="hidden:2:assistant" data-chatgpt-search-message-ids="hidden-answer">Hidden answer</div>
  <textarea id="native-composer"></textarea>
</main>
