[package]
name = "lattice"
version = "0.1.0"
description = "Local-first branching AI workspace"
authors = ["Lattice contributors"]
edition = "2021"

[lib]
name = "lattice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
