name: Release browser extension

on:
  push:
    branches: [main, codex/chatgpt-browser-extension]
    paths:
      - extension/public/manifest.json
      - .github/workflows/extension-release.yml
      - .github/scripts/extension-release.mjs
      - .github/release-notes/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/chatgpt-browser-extension'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.plan.outputs.version }}
      should_release: ${{ steps.plan.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check extension version and existing release
        id: plan
        run: node .github/scripts/extension-release.mjs plan
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.plan.outputs.should_release == 'true'
        with:
          run_install: false
      - name: Install locked dependencies
        if: steps.plan.outputs.should_release == 'true'
        run: pnpm install --frozen-lockfile
      - name: Test, lint, and build extension
        if: steps.plan.outputs.should_release == 'true'
        run: |
          pnpm extension:release:test
          pnpm test
          pnpm lint
          pnpm extension:build
      - name: Prepare versioned ZIP, checksum, and release notes
        if: steps.plan.outputs.should_release == 'true'
        run: node .github/scripts/extension-release.mjs prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.should_release == 'true'
        with:
          name: extension-${{ github.sha }}
          path: release/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: extension-release-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-${{ github.sha }}
          path: release/
      - name: Publish release after verifying assets
        run: node .github/scripts/extension-release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
